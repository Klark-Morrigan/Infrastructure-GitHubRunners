---
# One host's runner verdicts, included by playbooks/runner-status.yml and by
# the runner_status molecule scenario. Reads vm_runner_entries and sets
# runner_status_results: one verdict per runner, each carrying the report line
# the play prints. Read-only: every task is a read, and none is fatal.
#
# Two independent signals make a runner UP:
#   service_active - its systemd unit is `active` on the VM.
#   github_status  - GitHub's view of it (online / offline). 'absent' when
#                    GitHub does not list it; 'query-failed-http-N' when the
#                    API call itself failed (surfaced, not hidden, even though
#                    the query is no_log for the PAT).
# The egress facts from _runner-status-egress.yml ride along for diagnosis
# only; they do not change the verdict.
#
# Every on-VM read is gated on one SSH check, so a down VM costs one
# connection timeout rather than one per task, and its runners still get a
# DOWN verdict. GitHub is queried controller-side once per repository.

- name: Initialise the per-host status accumulator
  ansible.builtin.set_fact:
    runner_status_results: []
    runner_status_github_by_url: {}

- name: Check the VM answers over SSH
  ansible.builtin.ping:
  register: runner_status_vm_ping
  ignore_unreachable: true

- name: Record whether the VM answers
  ansible.builtin.set_fact:
    runner_status_vm_reachable: "{{ not (runner_status_vm_ping.unreachable | default(false)) }}"

- name: Probe the VM's egress to GitHub
  ansible.builtin.include_tasks: _runner-status-egress.yml

# One SSH round trip for every runner unit on the VM, rather than two per
# runner. `systemctl is-active` observes a unit's live state; the systemd
# module manages desired state and cannot report it without making a change a
# read-only probe must not make. list-unit-files exits non-zero when nothing
# matches, which here just means no runner units: `|| true` keeps that a
# result.
- name: Read every runner unit's state on the VM
  ansible.builtin.shell: >-
    set -o pipefail;
    { systemctl list-unit-files --type=service --no-pager --no-legend 'actions.runner.*' || true; }
    | awk '{ print $1 }'
    | while read -r unit; do printf '%s %s\n' "${unit}" "$(systemctl is-active "${unit}")"; done
  args:
    executable: /bin/bash
  register: runner_status_units
  changed_when: false
  ignore_unreachable: true
  when: runner_status_vm_reachable | bool

- name: Record each runner unit's state
  ansible.builtin.set_fact:
    runner_status_unit_states: >-
      {{ dict(runner_status_units.stdout_lines | default([]) | map('split')) }}

- name: Query GitHub for every page of each repository's runners
  ansible.builtin.include_tasks: _runner-status-github-repo.yml
  vars:
    # GitHub's largest page, so most repositories take one request.
    runner_status_github_page_size: 100
  loop: "{{ vm_runner_entries | map(attribute='githubUrl') | unique | list }}"
  loop_control:
    loop_var: github_url

- name: Record each runner's verdict
  vars:
    github: "{{ runner_status_github_by_url[entry.githubUrl] }}"
    # The matching runner object from the GitHub response, or {} when GitHub
    # does not list it or the call failed.
    github_runner: >-
      {{ github.runners | selectattr('name', 'equalto', entry.runnerName)
         | first | default({}) }}
    github_status: >-
      {{ (github.status != 200)
         | ternary('query-failed-http-' ~ github.status,
                   github_runner.status | default('absent')) }}
    github_busy: "{{ github_runner.busy | default(false) | bool }}"
    # The unit is actions.runner.<owner-repo>.<runner>.service; matching the
    # whole last segment keeps runner-up from matching x-runner-up.
    unit_state: >-
      {{ runner_status_unit_states | dict2items
         | selectattr('key', 'search', '\.' ~ (entry.runnerName | regex_escape) ~ '\.service$')
         | map(attribute='value') | first | default('') }}
    service_active: "{{ unit_state == 'active' }}"
    runner_up: "{{ (service_active | bool) and (github_status == 'online') }}"
    report_line: >-
      {{ inventory_hostname }}/{{ entry.runnerName }}:
      {{ (runner_up | bool) | ternary('UP', 'DOWN') }}
      [service={{ (service_active | bool) | ternary('active', 'inactive') }},
      github={{ github_status }}{{ (github_busy | bool) | ternary(' (busy)', '') }},
      egress={{ (runner_status_egress_reachable | bool) | ternary('ok', 'unreachable') }}{{
      (runner_status_egress_diagnosis | length > 0)
      | ternary(' (' ~ runner_status_egress_diagnosis ~ ')', '') }}]
  ansible.builtin.set_fact:
    runner_status_results: >-
      {{ runner_status_results + [{
           'vm': inventory_hostname,
           'runner': entry.runnerName,
           'up': (runner_up | bool),
           'service_active': (service_active | bool),
           'github_status': github_status,
           'github_busy': (github_busy | bool),
           'egress_reachable': (runner_status_egress_reachable | bool),
           'egress_diagnosis': runner_status_egress_diagnosis,
           'report_line': report_line,
         }] }}
  loop: "{{ vm_runner_entries }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.runnerName }}"
