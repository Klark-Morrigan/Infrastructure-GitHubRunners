---
# Converge - drive playbooks/tasks/_runner-status-host.yml, the play's whole
# per-host step, against three fixtured runners and assert the report line
# each produces:
#   runner-up        unit active   + GitHub online  -> UP
#   runner-svc-down  unit inactive + GitHub online  -> DOWN (service axis)
#   runner-gh-down   unit active   + GitHub absent  -> DOWN (github axis)
# The assertions live here because host facts do not cross to a separate
# verify play.
#
# GitHub: runner-gh-down shares runner-up's repository, so the mock's request
# log shows one query per repository. runner-svc-down sits on the mock's
# second page (see prepare), so it reads online only if every page is read.
#
# Egress runs twice. First against the container's own HTTP listener: the
# probe reaches it, so no diagnosis runs. Then against a dead port, since the
# default would hit api.github.com for real, which this hermetic scenario must
# not depend on. The probe fails, the real diagnosis script runs on the
# container against prepare's stub probe tools, and every line carries its
# no-default-gateway verdict.

- name: Converge - runner-status per-host verdicts
  hosts: all
  gather_facts: false
  vars:
    github_token: "fake-pat-for-molecule-scenario-only"
    github_api_base_url: "http://127.0.0.1:18082"
    runner_egress_probe_url: "http://127.0.0.1:9"
    mock_log: /tmp/runner-status-mock.log
    vm_runner_entries:
      - vmName: instance
        runnerName: runner-up
        runnerUsername: u-runner
        githubUrl: https://github.com/example/repo-up
      - vmName: instance
        runnerName: runner-svc-down
        runnerUsername: u-runner
        githubUrl: https://github.com/example/repo-svc
      - vmName: instance
        runnerName: runner-gh-down
        runnerUsername: u-runner
        githubUrl: https://github.com/example/repo-up
  tasks:
    - name: Probe the runners with egress open (local listener)
      ansible.builtin.include_tasks: ../../../../playbooks/tasks/_runner-status-host.yml
      vars:
        runner_egress_probe_url: "http://127.0.0.1:18083"

    - name: Assert open egress reads ok, with no diagnosis
      vars:
        report_lines: "{{ runner_status_results | map(attribute='report_line') | list }}"
        expected_lines:
          - "instance/runner-up: UP [service=active, github=online, egress=ok]"
          - "instance/runner-svc-down: DOWN [service=inactive, github=online, egress=ok]"
          - "instance/runner-gh-down: DOWN [service=active, github=absent, egress=ok]"
      ansible.builtin.assert:
        that:
          - report_lines == expected_lines
        fail_msg: "report lines wrong: {{ report_lines }}"

    - name: Read the mock's request log before the dead-port pass
      ansible.builtin.slurp:
        src: "{{ mock_log }}"
      delegate_to: localhost
      register: mock_log_before

    - name: Probe the runners with egress dead
      ansible.builtin.include_tasks: ../../../../playbooks/tasks/_runner-status-host.yml

    - name: Read the mock's request log after the dead-port pass
      ansible.builtin.slurp:
        src: "{{ mock_log }}"
      delegate_to: localhost
      register: mock_log_after

    - name: Assert each runner's verdict and report line (dead egress, stubbed diagnosis)
      vars:
        report_lines: "{{ runner_status_results | map(attribute='report_line') | list }}"
        up_flags: "{{ runner_status_results | map(attribute='up') | list }}"
        dead_egress: >-
          egress=unreachable (no-default-gateway: this VM has no default route
          through a gateway; check its netplan gateway)
        expected_lines:
          - "instance/runner-up: UP [service=active, github=online, {{ dead_egress }}]"
          - "instance/runner-svc-down: DOWN [service=inactive, github=online, {{ dead_egress }}]"
          - "instance/runner-gh-down: DOWN [service=active, github=absent, {{ dead_egress }}]"
      ansible.builtin.assert:
        that:
          - report_lines == expected_lines
          - up_flags == [true, false, false]
        fail_msg: "verdicts wrong: {{ up_flags }} {{ report_lines }}"

    - name: Assert GitHub was queried once per repository, for every page
      vars:
        logged_before: "{{ (mock_log_before.content | b64decode).splitlines() | length }}"
        requests: >-
          {{ (mock_log_after.content | b64decode).splitlines()[logged_before | int:]
             | map('from_json') | map(attribute='path') | list }}
        expected_requests:
          - /repos/example/repo-up/actions/runners?per_page=100&page=1
          - /repos/example/repo-up/actions/runners?per_page=100&page=2
          - /repos/example/repo-svc/actions/runners?per_page=100&page=1
          - /repos/example/repo-svc/actions/runners?per_page=100&page=2
      ansible.builtin.assert:
        that:
          - requests == expected_requests
        fail_msg: "GitHub requests wrong: {{ requests }}"
